services:
  postgres:
    image: postgres:16-alpine
    container_name: restaurants_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurants_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - restaurants_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: restaurants_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/restaurants_db
      JWT_SECRET: change_this_secret_in_production_min_32_chars
      JWT_EXPIRES_IN: 7d
      PORT: 5000
      NODE_ENV: production
    networks:
      - restaurants_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: restaurants_frontend
    restart: unless-stopped
    networks:
      - restaurants_net

  nginx:
    image: nginx:1.25-alpine
    container_name: restaurants_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - restaurants_net

volumes:
  postgres_data:

networks:
  restaurants_net:
    driver: bridge
